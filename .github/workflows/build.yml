name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch cancels the first build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is the oldest runner that can build for macOS 14, which is the
        # deployment target. Keep both so a regression on the minimum supported
        # macOS is caught here rather than by a user.
        runner: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ matrix.runner }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.runner }}-spm-

      - name: Build (debug)
        run: swift build

      # The harness is a normal executable rather than `swift test`, because
      # SwiftPM's XCTest and swift-testing bundles are not available to this
      # project's toolchain constraints. It exits non-zero on any failure.
      - name: Run verification suites
        run: ./.build/debug/SourceDeskHarness

      - name: Build (release)
        run: swift build -c release

      - name: Upload the app binary (release build)
        if: matrix.runner == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: SourceDesk-release-${{ github.sha }}
          path: .build/release/SourceDesk
          if-no-files-found: error
          retention-days: 30
